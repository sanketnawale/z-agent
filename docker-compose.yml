services:
  z-agent:
    build: .
    container_name: z-agent
    ports:
      - "8001:8001"
    environment:
      FASTAPI_URL: http://127.0.0.1:3001
      OLLAMA_URL: http://ollama:11434/api/generate
      # Production-grade Django configuration (v1.2.0 readiness).
      # Override DJANGO_SECRET_KEY for any real deployment.
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,zagent.cloudnova.tech"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://zagent.cloudnova.tech"
      DJANGO_SECRET_KEY: "change-me-in-production"
      WEB_WORKERS: "2"
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: z-agent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
