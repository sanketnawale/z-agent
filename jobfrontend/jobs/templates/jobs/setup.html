<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Z-Agent Setup</title>
    {% load static %}
    <link rel="icon" type="image/x-icon" href="{% static 'jobs/favicon.ico' %}">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #06101f;
            color: #e8f4ff;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 420px;
            background: #0c1626;
            border: 1px solid rgba(86,215,255,.25);
            border-radius: 22px;
            padding: 26px;
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        p {
            color: #91a8c2;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            color: #91a8c2;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .12em;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            min-height: 44px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,.12);
            background: #101b2d;
            color: #e8f4ff;
            padding: 0 12px;
            font-size: 15px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 12px;
        }

        .check {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
            color: #91a8c2;
            font-size: 13px;
        }

        .check input {
            width: auto;
            min-height: auto;
        }

        button {
            width: 100%;
            margin-top: 22px;
            min-height: 48px;
            border: 0;
            border-radius: 999px;
            background: linear-gradient(135deg, #ff9f43, #ffd08f);
            color: #07101f;
            font-weight: 900;
            cursor: pointer;
        }

        .error {
            background: rgba(255, 80, 80, .12);
            border: 1px solid rgba(255, 80, 80, .35);
            color: #ffd0d0;
            padding: 12px;
            border-radius: 12px;
            margin: 14px 0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Z-Agent</h1>
    <p>Connect to IBM Z using your own z/OSMF credentials.</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'setup' %}">
        {% csrf_token %}

        <label>z/OSMF Host</label>
        <input name="host" value="{{ form.host }}" placeholder="204.90.115.200" required>

        <div class="row">
            <div>
                <label>User ID</label>
                <input name="user" value="{{ form.user }}" placeholder="Z00805" required>
            </div>
            <div>
                <label>Port</label>
                <input name="port" value="{{ form.port }}" placeholder="10443" required>
            </div>
        </div>

        <label>Password</label>
        <input type="password" name="password" placeholder="Your IBM Z password" required>

        <label class="check">
            <input type="checkbox" name="allow_self_signed" {% if form.allow_self_signed %}checked{% endif %}>
            Allow self-signed certificate
        </label>

        <button type="submit">Test Connection & Enter Workspace</button>
    </form>
</div>

</body>
</html>
